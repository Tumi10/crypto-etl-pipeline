name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1 — checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2 — log in to Azure
      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}"}'

      # Step 3 — log in to container registry
      - name: Login to Container Registry
        run: |
          az acr login --name cryptoregistry

      # Step 4 — build and push FastAPI image
      - name: Build and Push FastAPI
        run: |
          docker build -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/fastapi:latest ./backend\ API
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/fastapi:latest

      # Step 5 — build and push Streamlit image
      - name: Build and Push Streamlit
        run: |
          docker build -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/streamlit:latest .
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/streamlit:latest

      # Step 6 — connect kubectl to AKS
      - name: Get AKS credentials
        run: |
          az aks get-credentials --resource-group crypto-rg --name crypto-aks

      # Step 7 — deploy to Kubernetes
      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/fastapi.yaml
          kubectl apply -f k8s/streamlit.yaml
          kubectl rollout restart deployment fastapi-deployment
          kubectl rollout restart deployment streamlit-deployment